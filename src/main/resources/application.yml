spring:
  application:
    name: service-dependency-analyzer
  datasource:
    url: jdbc:sqlite:./data/graph.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      # Pool size is set programmatically in IngestConfig to consumer-count + 5 so the
      # two values can never drift apart. WAL is persistent at the file level and is
      # enabled in SqlitePragmaInitializer; synchronous=NORMAL is per-connection and
      # is applied here on every checkout.
      connection-init-sql: "PRAGMA synchronous=NORMAL"
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      continue-on-error: false

server:
  port: 8080
  shutdown: graceful

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

sda:
  ingest:
    producer-count: 2
    consumer-count: 2
    queue-capacity: 10000
    # 0 = BLOCK indefinitely on put (default, recommended for state-mutation events).
    # >0 = use timed offer; on timeout the event is dropped with a structured WARN log
    # and the dropped_events counter increments. Only enable if you'd rather lose
    # events than block.
    put-timeout-ms: 0
    # Sizing hint for SeenEventsCache. The exact-set default ignores it; the future
    # BloomFilterCache uses it to choose bit-array size given a target FPR.
    dedup-cache-capacity: 200000
  health:
    window-seconds: 300
    # Hard cap on the per-Edge in-memory sample deque. Protects heap if a single edge
    # gets pathologically hot. The deque is also bounded by age (window-seconds), so the
    # effective size is min(max-samples-per-edge, samples within window).
    max-samples-per-edge: 1024
  events:
    generator:
      # Master switch. When false, the synthetic generator is not wired; the system
      # accepts events only via the HTTP ingest endpoint. Default: true so a fresh
      # `./gradlew bootRun` produces a meaningful dataset.
      enabled: true
      service-count: 5000
      event-count: 100000
      hub-count: 8           # high fan-in services
      cycles-to-inject: 3
      error-rate: 0.05       # 5% non-OK status on dependency_observed
      duplicate-rate: 0.01   # 1% exact-replay duplicates (drives the dedup path)
      seed: 42

logging:
  level:
    com.groupon.sda: INFO
