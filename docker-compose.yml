services:
  sda:
    build:
      context: .
      dockerfile: Dockerfile
    image: service-dependency-analyzer:latest
    container_name: sda
    ports:
      - "8080:8080"
    volumes:
      - sda-data:/app/data
    environment:
      # Override Spring properties via SPRING_* / SDA_* env vars (Spring relaxed binding).
      # Default leaves the synthetic generator on so a fresh `docker compose up` produces
      # a meaningful dataset, matching the bare-metal `./gradlew bootRun` experience.
      SDA_EVENTS_GENERATOR_ENABLED: "true"
      JAVA_OPTS: "-XX:MaxRAMPercentage=75"
    restart: unless-stopped
    stop_grace_period: 30s

  sda-mcp:
    build:
      context: ./mcp
      dockerfile: Dockerfile
    image: sda-mcp:latest
    container_name: sda-mcp
    depends_on:
      - sda
    environment:
      # In-network DNS resolves `sda` to the service container.
      SDA_BASE_URL: "http://sda:8080"
    # Keep stdin open so `docker exec -i sda-mcp node dist/index.js` can pipe MCP
    # JSON-RPC traffic. The container itself runs no daemon — see mcp/Dockerfile.
    stdin_open: true
    tty: false
    restart: unless-stopped

volumes:
  sda-data:
